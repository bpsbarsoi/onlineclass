<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Tests & Quizzes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- TOP APP HEADER -->
    <div class="bg-gradient-to-r from-purple-800 via-purple-700 to-indigo-900 text-white px-4 pt-5 pb-8 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </a>
                <div>
                    <h1 class="text-lg font-black tracking-wide">Test Series</h1>
                    <p class="text-xs text-purple-200">Online Exams & Mock Tests</p>
                </div>
            </div>
            <div class="w-9 h-9 rounded-full bg-purple-600/50 border border-purple-400/40 flex items-center justify-center text-yellow-300">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-md mx-auto px-4 -mt-4 space-y-4">

        <!-- STATUS TABS -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar text-xs font-semibold bg-white p-1 rounded-2xl border border-gray-100 shadow-sm">
            <button onclick="filterStatus('active')" class="tab-btn flex-1 active bg-purple-700 text-white py-2 rounded-xl text-center transition">
                Active Tests
            </button>
            <button onclick="filterStatus('upcoming')" class="tab-btn flex-1 text-gray-600 py-2 rounded-xl text-center transition">
                Upcoming
            </button>
            <button onclick="filterStatus('completed')" class="tab-btn flex-1 text-gray-600 py-2 rounded-xl text-center transition">
                Completed
            </button>
        </div>

        <!-- TESTS LIST CONTAINER -->
        <div id="testsContainer" class="space-y-3">
            <!-- Dynamic Tests Rendered Here -->
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx8HWr14jS3wkZlluGnNw37EKtzO4sQyCxko7y_LhPcV-3hMJr5wBxqe4ea0UVRitQiEg/exec";

        let testsList = [];
        let currentTab = 'active';

        async function fetchTestsFromSheet() {
            const container = document.getElementById("testsContainer");
            container.innerHTML = `
                <div class="text-center py-12 text-gray-500">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-purple-700 mb-3"></i>
                    <p class="text-xs font-semibold">Loading test series...</p>
                </div>`;

            try {
                const res = await fetch(`${API_URL}?action=getTests`);
                testsList = await res.json();
                renderTests();
            } catch (err) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-circle-exclamation text-3xl text-red-500 mb-2"></i>
                        <p class="text-gray-700 font-bold text-xs">Failed to load tests!</p>
                        <button onclick="fetchTestsFromSheet()" class="mt-3 px-4 py-1.5 bg-purple-700 text-white rounded-xl text-xs font-bold">Retry</button>
                    </div>`;

                Swal.fire({
                    icon: 'error',
                    title: 'Error!',
                    text: 'Unable to connect to server. Please check your connection.',
                    confirmButtonColor: '#6b21a8'
                });
            }
        }

        function renderTests() {
            const container = document.getElementById("testsContainer");

            const filtered = testsList.filter(t => (t.status || 'active').toLowerCase() === currentTab.toLowerCase());

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-clipboard-check text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-600 font-bold text-sm">No Tests Available!</p>
                        <p class="text-gray-400 text-xs mt-1">There are no ${currentTab} tests at the moment.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(t => {
                let btnHtml = '';
                if (currentTab === 'active') {
                    btnHtml = `<button onclick="startTest('${t.title.replace(/'/g, "\\'")}', '${t.testUrl}')" class="w-full mt-3 py-2 bg-purple-700 hover:bg-purple-800 text-white rounded-xl text-xs font-bold shadow-sm transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play text-[10px]"></i> Attempt Test Now
                    </button>`;
                } else if (currentTab === 'upcoming') {
                    btnHtml = `<div class="w-full mt-3 py-2 bg-amber-50 text-amber-700 border border-amber-200 rounded-xl text-xs font-bold text-center flex items-center justify-center gap-2">
                        <i class="fa-regular fa-clock"></i> Starts On: ${t.date || 'Soon'}
                    </div>`;
                } else {
                    btnHtml = `<div class="w-full mt-3 py-2 bg-gray-100 text-gray-500 rounded-xl text-xs font-bold text-center flex items-center justify-center gap-2">
                        <i class="fa-solid fa-lock"></i> Test Expired
                    </div>`;
                }

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-100 text-purple-700">
                                ${t.questions || 'Quiz'}
                            </span>
                            <span class="text-[10px] font-medium text-gray-400">
                                <i class="fa-regular fa-clock mr-1"></i>${t.time || 'N/A'}
                            </span>
                        </div>

                        <h3 class="font-bold text-sm text-gray-800">${t.title}</h3>

                        <div class="flex items-center gap-4 text-xs text-gray-500 pt-1">
                            <span><i class="fa-solid fa-award text-yellow-500 mr-1"></i>${t.marks || 'Full Marks'}</span>
                        </div>

                        ${btnHtml}
                    </div>
                `;
            }).join('');
        }

        function filterStatus(status) {
            currentTab = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.innerText.toLowerCase().includes(status.toLowerCase())) {
                    btn.className = "tab-btn flex-1 active bg-purple-700 text-white py-2 rounded-xl text-center transition";
                } else {
                    btn.className = "tab-btn flex-1 text-gray-600 py-2 rounded-xl text-center transition";
                }
            });
            renderTests();
        }

        function startTest(title, url) {
            if (!url || url === '#' || url.trim() === '') {
                Swal.fire({
                    icon: 'warning',
                    title: 'Link Unavailable',
                    text: 'Is test ka link abhi update nahi hua hai.',
                    confirmButtonColor: '#6b21a8'
                });
                return;
            }

            Swal.fire({
                title: 'Start Test?',
                text: `Kya aap "${title}" start karna chahte hain?`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#6b21a8',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Haan, Start Karein!',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.open(url, '_blank');
                }
            });
        }

        // Page Load Par Data Fetch Karein
        fetchTestsFromSheet();
    </script>
</body>
</html>
