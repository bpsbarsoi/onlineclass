<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - Barsoi Public School</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- TOP APP HEADER -->
    <div class="bg-gradient-to-r from-purple-800 via-purple-700 to-indigo-900 text-white px-4 pt-5 pb-8 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </a>
                <div>
                    <h1 class="text-lg font-black tracking-wide">Assignments</h1>
                    <p class="text-xs text-purple-200">Practice Sheets & Homework</p>
                </div>
            </div>
            <div class="w-9 h-9 rounded-full bg-purple-600/50 border border-purple-400/40 flex items-center justify-center text-yellow-300">
                <i class="fa-solid fa-file-pen"></i>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-md mx-auto px-4 -mt-4 space-y-4">

        <!-- SEARCH / FILTER BOX -->
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm ml-2"></i>
            <input type="text" id="searchInput" oninput="filterAssignments()" placeholder="Search assignment title..." class="w-full text-xs bg-transparent focus:outline-none">
        </div>

        <!-- ASSIGNMENTS LIST CONTAINER -->
        <div id="assignmentsContainer" class="space-y-3">
            <!-- Dynamic Data Rendered Here -->
        </div>

    </div>

    <script>
        // AAPKA EXISTING APPS SCRIPT EXEC URL
        const API_URL = "https://script.google.com/macros/s/AKfycbx8HWr14jS3wkZlluGnNw37EKtzO4sQyCxko7y_LhPcV-3hMJr5wBxqe4ea0UVRitQiEg/exec";

        let allAssignments = [];

        async function fetchAssignments() {
            const container = document.getElementById("assignmentsContainer");
            container.innerHTML = `
                <div class="text-center py-12 text-gray-500">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-purple-700 mb-3"></i>
                    <p class="text-xs font-semibold">Loading assignments...</p>
                </div>`;

            try {
                // Bina Code.gs badle existing getContent action use ho raha hai
                const res = await fetch(`${API_URL}?action=getContent`);
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    // Sirf wahi content filter karenge jiska Type 'Assignment' ya 'PDF' ho
                    allAssignments = data.filter(item => {
                        const type = String(item.Type || '').toLowerCase();
                        return type.includes('assignment') || type.includes('pdf') || type.includes('homework');
                    });
                    renderAssignments(allAssignments);
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (err) {
                console.error("Error loading assignments:", err);
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-circle-exclamation text-3xl text-red-500 mb-2"></i>
                        <p class="text-gray-700 font-bold text-xs">Failed to load assignments!</p>
                        <button onclick="fetchAssignments()" class="mt-3 px-4 py-1.5 bg-purple-700 text-white rounded-xl text-xs font-bold">Retry</button>
                    </div>`;
            }
        }

        function renderAssignments(list) {
            const container = document.getElementById("assignmentsContainer");

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-sm">
                        <i class="fa-solid fa-folder-open text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-600 font-bold text-sm">No Assignments Found!</p>
                        <p class="text-gray-400 text-xs mt-1">There are no assignments uploaded yet.</p>
                    </div>`;
                return;
            }

            container.innerHTML = list.map((item, index) => {
                const fileUrl = item.URL && item.URL !== '#' ? item.URL : 'javascript:void(0)';
                const targetAttr = item.URL && item.URL !== '#' ? 'target="_blank"' : '';

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center flex-shrink-0">
                                <i class="fa-solid fa-file-pdf text-lg"></i>
                            </div>
                            <div class="truncate">
                                <h3 class="text-xs font-bold text-gray-800 truncate">${item.Title || 'Assignment ' + (index + 1)}</h3>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-[10px] bg-purple-50 text-purple-700 font-semibold px-2 py-0.5 rounded">Course: ${item.CourseID || 'General'}</span>
                                    ${item.IsFreePreview ? '<span class="text-[10px] bg-green-50 text-green-700 font-semibold px-2 py-0.5 rounded">Free</span>' : ''}
                                </div>
                            </div>
                        </div>

                        <a href="${fileUrl}" ${targetAttr} class="flex-shrink-0 px-3 py-1.5 bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold rounded-xl shadow-sm transition flex items-center gap-1.5">
                            <i class="fa-solid fa-download"></i> Open
                        </a>
                    </div>
                `;
            }).join('');
        }

        function filterAssignments() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allAssignments.filter(item => 
                String(item.Title || '').toLowerCase().includes(query) ||
                String(item.CourseID || '').toLowerCase().includes(query)
            );
            renderAssignments(filtered);
        }

        // Load assignments on page start
        fetchAssignments();
    </script>
</body>
</html>
