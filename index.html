    <!-- JavaScript Execution Engine -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx8HWr14jS3wkZlluGnNw37EKtzO4sQyCxko7y_LhPcV-3hMJr5wBxqe4ea0UVRitQiEg/exec";
        const MERCHANT_UPI_ID = "riyazahmad5@okaxis";
        
        let loggedInStudent = null;
        let allCoursesList = [];
        let studentPayments = [];
        let currentViewMode = 'buy';
        let currentCategory = 'All';

        // Auto Login Check
        window.addEventListener("DOMContentLoaded", () => {
            const savedStudent = localStorage.getItem("cw_student");
            if (savedStudent) {
                loggedInStudent = JSON.parse(savedStudent);
                showPortal();
            }
        });

                // Track Login Activity Function - MANDATORY LOCATION PERMISSION WITH MODEL CODE
        async function trackStudentLogin(studentEmail) {
            return new Promise(async (resolve) => {
                const ua = navigator.userAgent;

                // 1. Precise Model Code Detection (with UA Client Hints Fallback)
                let deviceName = "Desktop/Laptop";

                if (/iPhone/i.test(ua)) {
                    deviceName = "iPhone (iOS)";
                } else if (/iPad/i.test(ua)) {
                    deviceName = "iPad (iOS)";
                } else if (/Android/i.test(ua)) {
                    let detectedModel = "";

                    // Try Modern High-Entropy User Agent API (Chrome Android)
                    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                        try {
                            const uaData = await navigator.userAgentData.getHighEntropyValues(["model"]);
                            if (uaData && uaData.model) {
                                detectedModel = uaData.model;
                            }
                        } catch (e) {
                            // Fallback if API fails
                        }
                    }

                    // Fallback to UserAgent Parsing
                    if (!detectedModel) {
                        const androidMatch = ua.match(/Android\s+[\d.]+;(?:\s*[^;]+;)?\s*([^;)]+)\s*\)/i);
                        if (androidMatch && androidMatch[1]) {
                            detectedModel = androidMatch[1].replace(/Build\/.*/i, '').trim();
                        }
                    }

                    // Clean Model Text
                    if (detectedModel) {
                        detectedModel = detectedModel.replace(/^K\s+/i, '').replace(/^Linux;\s*/i, '').trim();
                        if (detectedModel === "K" || detectedModel.length <= 1) {
                            detectedModel = "";
                        }
                    }

                    deviceName = detectedModel ? `Android (${detectedModel})` : "Android Mobile";
                }

                // 2. Exact Browser Detection Logic
                let detectedBrowser = "Other Browser";
                if (ua.includes("OPR") || ua.includes("Opera")) {
                    detectedBrowser = "Opera";
                } else if (ua.includes("Edg")) {
                    detectedBrowser = "Microsoft Edge";
                } else if (ua.includes("Chrome")) {
                    detectedBrowser = "Chrome";
                } else if (ua.includes("Safari")) {
                    detectedBrowser = "Safari";
                } else if (ua.includes("Firefox")) {
                    detectedBrowser = "Firefox";
                }
                // Exact OS Detection Logic
                let detectedOS = navigator.platform;
                if (/Android/i.test(ua)) {
                    const match = ua.match(/Android\s([0-9\.]+)/i);
                    detectedOS = match ? `Android ${match[1]}` : "Android";
                } else if (/iPhone|iPad|iPod/i.test(ua)) {
                    detectedOS = "iOS";
                } else if (/Win/i.test(navigator.platform)) {
                    detectedOS = "Windows";
                } else if (/Mac/i.test(navigator.platform)) {
                    detectedOS = "macOS";
                } else if (/Linux/i.test(navigator.platform)) {
                    detectedOS = "Linux";
                }

                const getAddressFromCoords = async (lat, lon) => {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await res.json();
                        if (data && data.address) {
                            const city = data.address.city || data.address.town || data.address.village || data.address.county || "";
                            const state = data.address.state || "";
                            const country = data.address.country || "";
                            return [city, state, country].filter(Boolean).join(", ");
                        }
                    } catch (e) {
                        return null;
                    }
                };

                                async function sendPayload(latLonStr, locationStr) {
                    const payload = {
                        action: "trackLogin",
                        payload: {
                            studentEmail: studentEmail,
                            device: deviceName,
                            ipAddress: latLonStr,
                            location: locationStr,
                            browser: detectedBrowser,
                            os: detectedOS // <-- Yahan navigator.platform ki jagah detectedOS karein
                        }
                    };

                    await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                }

                // Mandatory SweetAlert Permission Prompt
                Swal.fire({
                    title: 'Location Permission Required',
                    text: 'Location access is compulsory (MANDATORY).',
                    icon: 'warning',
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    showCancelButton: true,
                    cancelButtonText: 'Cancel Login',
                    confirmButtonColor: '#7e22ce',
                    confirmButtonText: 'Allow & Proceed'
                }).then((result) => {
                    if (result.isConfirmed) {
                        if (!("geolocation" in navigator)) {
                            Swal.fire({
                                icon: 'error',
                                title: 'GPS Not Supported',
                                text: 'Aapke browser me Geolocation feature supports nahi hai.'
                            });
                            resolve(false);
                            return;
                        }

                        Swal.fire({
                            title: 'Verifying Location...',
                            text: 'Please "Allow" in browser prompt.',
                            allowOutsideClick: false,
                            allowEscapeKey: false,
                            didOpen: () => { Swal.showLoading(); }
                        });

                        navigator.geolocation.getCurrentPosition(
                            async (position) => {
                                const lat = position.coords.latitude.toFixed(5);
                                const lon = position.coords.longitude.toFixed(5);
                                const latLonStr = `Lat: ${lat}, Lon: ${lon}`;
                                
                                const address = await getAddressFromCoords(lat, lon);
                                const locationStr = address ? `${address} (GPS)` : `${lat}, ${lon}`;

                                await sendPayload(latLonStr, locationStr);

                                Swal.fire({
                                    icon: 'success',
                                    title: 'Location Verified!',
                                    text: `Welcome to Portal`,
                                    timer: 1500,
                                    showConfirmButton: false
                                });
                                resolve(true);
                            },
                            (error) => {
                                Swal.fire({
                                    icon: 'error',
                                    title: 'Location Denied!',
                                    text: 'Location Access is compulsory.Allow location access to proceed on the portal.',
                                    confirmButtonColor: '#7e22ce'
                                });
                                resolve(false);
                            },
                            { timeout: 10000, enableHighAccuracy: true }
                        );
                    } else {
                        Swal.fire({
                            icon: 'info',
                            title: 'Login Cancelled',
                            text: 'You cannot login without Location access.'
                        });
                        resolve(false);
                    }
                });
            });
        }

        // Toggle Sidebar Drawer
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebarOverlay");
            sidebar.classList.toggle("-translate-x-full");
            overlay.classList.toggle("hidden");

        function navigatePage(page) {
            if(page === 'dashboard') window.location.href = "dashboard.html";
            else if(page === 'materials') window.location.href = "study-materials.html";
            else if(page === 'assignments') window.location.href = "assignments.html";
            else if(page === 'tests') window.location.href = "tests.html";
            else if(page === 'progress') window.location.href = "progress.html";
            else if(page === 'doubts') window.location.href = "doubts.html";
            else if(page === 'notices') window.location.href = "notices.html";
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const registerForm = document.getElementById("registerForm");
            const loginBtn = document.getElementById("loginTabBtn");
            const registerBtn = document.getElementById("registerTabBtn");

            if (tab === 'login') {
                loginForm.classList.remove("hidden");
                registerForm.classList.add("hidden");
                loginBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-purple-500 text-purple-400 focus:outline-none transition";
                registerBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 focus:outline-none transition";
            } else {
                loginForm.classList.add("hidden");
                registerForm.classList.remove("hidden");
                registerBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-green-500 text-green-400 focus:outline-none transition";
                loginBtn.className = "flex-1 py-2 text-center text-sm font-semibold border-b-2 border-transparent text-gray-400 hover:text-gray-200 focus:outline-none transition";
            }
        }

        // 1. Student Login Logic
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Verifying...`;
            btn.disabled = true;

            const userVal = document.getElementById("loginUser").value.trim();
            const passVal = document.getElementById("loginPass").value.trim();

            try {
                const response = await fetch(`${API_URL}?action=getStudents`);
                const students = await response.json();

                const match = students.find(s => {
                    const emailMatch = s.Email && String(s.Email).trim().toLowerCase() === userVal.toLowerCase();
                    const mobileMatch = s.Mobile && String(s.Mobile).trim() === userVal;
                    const passMatch = s.Password && String(s.Password).trim() === passVal;
                    return (emailMatch || mobileMatch) && passMatch;
                });

                if (match) {
                    // Mandatory Location Check before Login Completion
                    const isLocationAllowed = await trackStudentLogin(match.Email || match.Mobile || userVal);
                    
                    if (isLocationAllowed) {
                        loggedInStudent = match;
                        localStorage.setItem("cw_student", JSON.stringify(match));
                        showPortal();
                    }
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: 'Wrong Password or Mobile/Email!',
                        confirmButtonColor: '#7e22ce'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Server Error',
                    text: 'Could not connect.'
                });
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Login to Portal`;
                btn.disabled = false;
            }
        }

        // 2. Register Logic
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById("regBtn");
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Creating...`;
            btn.disabled = true;

            const payload = {
                action: "addStudent",
                payload: {
                    name: document.getElementById("regName").value.trim(),
                    email: document.getElementById("regEmail").value.trim(),
                    mobile: document.getElementById("regMobile").value.trim(),
                    password: document.getElementById("regPassword").value.trim()
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.status === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'Registration Successful!',
                        text: 'Ab aap login kar sakte hain.',
                        confirmButtonColor: '#7e22ce'
                    });

                    document.getElementById("registerForm").reset();
                    switchAuthTab('login');
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: result.message || 'Error occurred.' });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Server tak request fail ho gayi.' });
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-user-check"></i> Register Student`;
                btn.disabled = false;
            }
        }

        // 3. Show Dashboard
        function showPortal() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("portalSection").classList.remove("hidden");
            
            const displayName = loggedInStudent.FullName || loggedInStudent.Name || 'Student';
            document.getElementById("studentWelcome").innerText = `Hi, ${displayName.split(' ')[0]}`;
            
            document.getElementById("sideStudentName").innerText = displayName;
            document.getElementById("sideStudentMobile").innerText = loggedInStudent.Mobile || loggedInStudent.Email || 'Student';
            document.getElementById("sideAvatar").innerText = displayName.charAt(0).toUpperCase();

            loadAllBatches();
        }

        // 4. Load Batches & Student Payments status real-time from Google Sheets
        async function loadAllBatches() {
            const container = document.getElementById("batchesContainer");
            container.innerHTML = `
                <div class="text-center py-12 text-gray-500">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-purple-700 mb-2"></i>
                    <p class="text-xs font-semibold">Syncing Realtime Batches & Payments...</p>
                </div>`;

            try {
                const studentIdentifier = loggedInStudent.Email || loggedInStudent.Mobile || '';
                
                const [coursesRes, paymentsRes] = await Promise.all([
                    fetch(`${API_URL}?action=getCourses`),
                    fetch(`${API_URL}?action=getStudentPayments&email=${encodeURIComponent(studentIdentifier)}`)
                ]);

                allCoursesList = await coursesRes.json();
                studentPayments = await paymentsRes.json();

                renderBatches();
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500 py-10 text-xs">Batches could not load. Please refresh.</p>`;
            }
        }

        // 5. Render Batches List
        function renderBatches() {
            const container = document.getElementById("batchesContainer");
            const searchTxt = document.getElementById("searchInput").value.toLowerCase();

            let filtered = allCoursesList.filter(c => {
                const matchesSearch = c.Title.toLowerCase().includes(searchTxt);
                const matchesCat = currentCategory === 'All' || (c.Category && c.Category.toLowerCase().includes(currentCategory.toLowerCase()));
                
                const payRecord = studentPayments.find(p => String(p.CourseID || p["Course ID"]) === String(c.CourseID));
                const isApproved = payRecord && (payRecord.Status === "APPROVED" || payRecord.Status === "Paid");

                if (currentViewMode === 'my') {
                    return matchesSearch && matchesCat && isApproved;
                } else {
                    return matchesSearch && matchesCat && !isApproved;
                }
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 shadow-sm my-4">
                        <i class="fa-solid fa-graduation-cap text-4xl text-gray-300 mb-2"></i>
                        <p class="text-gray-600 font-bold text-sm">No Batch Allocated!</p>
                        <p class="text-gray-400 text-xs mt-1">${currentViewMode === 'my' ? 'You have not unlocked a batch yet or your verification is still under process.' : 'You have purchased all available batches.'}</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(course => {
                const payRecord = studentPayments.find(p => String(p.CourseID || p["Course ID"]) === String(course.CourseID));
                const isApproved = payRecord && (payRecord.Status === "APPROVED" || payRecord.Status === "Paid");
                const isPending = payRecord && payRecord.Status === "PENDING";

                return `
                <div class="bg-gray-900 text-white rounded-2xl overflow-hidden shadow-xl border border-gray-800 flex flex-col justify-between">
                    <div class="relative">
                        <img src="${course.ThumbnailURL || 'https://picsum.photos/400/200'}" class="w-full h-44 object-cover">
                        
                        <span class="absolute top-2 right-2 ${isApproved ? 'bg-green-500' : isPending ? 'bg-amber-500' : 'bg-yellow-400'} text-black text-[10px] font-black px-2 py-0.5 rounded-md shadow uppercase">
                            ${isApproved ? 'ACTIVE' : isPending ? 'VERIFYING' : 'NEW'}
                        </span>
                        
                        <span class="absolute top-2 left-2 bg-purple-900/80 backdrop-blur-md text-purple-200 text-[10px] font-bold px-2.5 py-0.5 rounded-md border border-purple-700">
                            ${course.Category || 'PW PATHSHALA'}
                        </span>
                    </div>

                    <div class="p-4">
                        <h3 class="font-black text-lg text-white tracking-wide">${course.Title}</h3>
                        <p class="text-gray-400 text-xs mt-1 line-clamp-2">${course.Description || 'Target for Academic & Competitive Exams with India Top Educators.'}</p>

                        <div class="mt-3 flex items-center justify-between border-t border-gray-800 pt-3">
                            <div>
                                <span class="text-gray-400 text-[10px] uppercase block font-semibold">Registration Fees</span>
                                <span class="text-base font-black text-white">₹${course.Price || '1000'}/-</span>
                            </div>

                            <div class="text-right">
                                <span class="text-green-400 text-[10px] font-bold block"><i class="fa-solid fa-circle-check"></i> Live + Recorded</span>
                                <span class="text-gray-400 text-[10px]">Notes & Tests Included</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gray-950 p-3 flex items-center gap-2 border-t border-gray-800">
                        ${isApproved ? `
                            <button onclick="viewLectures('${course.CourseID}')" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow flex items-center justify-center gap-2">
                                <i class="fa-solid fa-circle-play"></i> Let's Study
                            </button>
                        ` : isPending ? `
                            <button disabled class="flex-1 bg-amber-600/30 border border-amber-500/50 text-amber-300 font-bold text-xs py-2.5 rounded-xl cursor-not-allowed flex items-center justify-center gap-2">
                                <i class="fa-solid fa-clock fa-spin"></i> Verification Pending (Admin Approving...)
                            </button>
                        ` : `
                            <button onclick="purchaseCourse('${course.CourseID}', '${course.Title}', '${course.Price || 1000}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow flex items-center justify-center gap-2">
                                <i class="fa-solid fa-cart-shopping"></i> Buy Batch (₹${course.Price || 1000})
                            </button>
                        `}
                    </div>

                </div>`;
            }).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(btn => {
                if (btn.innerText.trim().toLowerCase() === cat.toLowerCase() || (cat === 'All' && btn.innerText.trim() === 'Trending')) {
                    btn.className = "cat-chip active bg-purple-700 text-white px-4 py-2 rounded-xl shadow-sm whitespace-nowrap";
                } else {
                    btn.className = "cat-chip bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 px-4 py-2 rounded-xl shadow-sm whitespace-nowrap";
                }
            });
            renderBatches();
        }

        function toggleBatchTab() {
            if (currentViewMode === 'buy') {
                switchBatchTab('my');
            } else {
                switchBatchTab('buy');
            }
        }

        function switchBatchTab(mode) {
            const btn = document.getElementById("toggleBatchTabBtn");
            const title = document.getElementById("viewTitle");

            currentViewMode = mode;
            if (mode === 'my') {
                btn.className = "bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex-shrink-0 flex items-center gap-1.5";
                btn.innerHTML = `<i class="fa-solid fa-store"></i> Buy Batches`;
                title.innerText = "My Purchased Batches";
            } else {
                btn.className = "bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow flex-shrink-0 flex items-center gap-1.5";
                btn.innerHTML = `<i class="fa-solid fa-book-bookmark"></i> My Batches`;
                title.innerText = "Purchase Batches / Store";
            }
            renderBatches();
        }

        function filterBatches() {
            renderBatches();
        }

        // UPI Payment Action
        function purchaseCourse(courseId, title, price) {
            const upiUrl = `upi://pay?pa=${MERCHANT_UPI_ID}&pn=${encodeURIComponent('ClassWalla')}&am=${price}&cu=INR&tn=${encodeURIComponent('Batch Purchase - ' + title)}`;

            Swal.fire({
                title: `<strong>Pay ₹${price} for ${title}</strong>`,
                icon: 'info',
                html: `
                    <div style="text-align: left; font-size: 13px; color: #374151;">
                        <p class="mb-2"><b>Step 1:</b> Click the button below to make the payment using any UPI app (GPay, PhonePe, Paytm).</p>
                        <div style="text-align: center; margin: 15px 0;">
                            <a href="${upiUrl}" target="_blank" style="background-color: #16a34a; color: white; padding: 10px 18px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 13px; display: inline-block;">
                                <i class="fa-solid fa-wallet mr-1"></i> Pay via UPI App (₹${price})
                            </a>
                        </div>
                        <p class="mt-3 mb-1"><b>Step 2:</b> After Payment enter <b>12-Digit UTR / Transaction ID</b> here:</p>
                        <input type="text" id="utrInput" placeholder="Enter 12-Digit UTR Number" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-top: 5px; font-size: 14px;">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#6d28d9',
                cancelButtonColor: '#4b5563',
                confirmButtonText: 'Submit for Verification',
                cancelButtonText: 'Cancel',
                preConfirm: () => {
                    const utr = document.getElementById('utrInput').value.trim();
                    if (!utr || utr.length < 6) {
                        Swal.showValidationMessage('Please enter valid UTR / Transaction ID !');
                        return false;
                    }
                    return utr;
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const utrNumber = result.value;
                    submitPaymentToSheet(courseId, title, price, utrNumber);
                }
            });
        }

        async function submitPaymentToSheet(courseId, title, price, utrNumber) {
            Swal.fire({
                title: 'Submitting Payment...',
                text: 'Your UTR is submitting.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const studentIdentifier = loggedInStudent.Email || loggedInStudent.Mobile || 'Student';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({
                        action: "registerPayment",
                        courseId: courseId,
                        courseTitle: title,
                        price: price,
                        utr: utrNumber,
                        studentEmail: studentIdentifier
                    })
                });

                const resData = await response.json();

                if (resData.status === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'Request Submitted!',
                        text: 'Your UTR has been submitted. The batch will be automatically unlocked once verified by the admin.',
                        confirmButtonColor: '#6d28d9'
                    });

                    loadAllBatches();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Submission Failed',
                        text: resData.message || 'This UTR has already been claimed!',
                        confirmButtonColor: '#ef4444'
                    });
                }

            } catch (error) {
                Swal.fire('Error', 'Server error. Please try again.', 'error');
            }
        }

        function viewLectures(courseId) {
            window.location.href = `learn.html?courseId=${courseId}`;
        }

        function logout() {
            localStorage.removeItem("cw_student");
            location.reload();
        }
    </script>
</body>
</html>
