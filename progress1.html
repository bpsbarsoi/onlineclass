<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance & Progress - Barsoi Public School</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-12">

    <!-- TOP APP HEADER -->
    <div class="bg-gradient-to-r from-purple-800 via-purple-700 to-indigo-900 text-white px-4 pt-5 pb-8 shadow-lg">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="dashboard.html" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </a>
                <div>
                    <h1 class="text-lg font-black tracking-wide">Performance & Progress</h1>
                    <p class="text-xs text-purple-200">Track Learning Metrics</p>
                </div>
            </div>
            <div class="w-9 h-9 rounded-full bg-purple-600/50 border border-purple-400/40 flex items-center justify-center text-yellow-300">
                <i class="fa-solid fa-chart-line"></i>
            </div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="max-w-md mx-auto px-4 -mt-4 space-y-4">

        <!-- OVERALL STATS SUMMARY -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 grid grid-cols-2 gap-3">
            <div class="bg-purple-50 p-3 rounded-xl border border-purple-100 text-center">
                <i class="fa-solid fa-user-graduate text-purple-700 text-lg mb-1"></i>
                <p class="text-[10px] text-gray-500 font-medium">Total Students</p>
                <h3 id="totalStudentsCount" class="text-base font-black text-purple-900">0</h3>
            </div>
            <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 text-center">
                <i class="fa-solid fa-trophy text-indigo-700 text-lg mb-1"></i>
                <p class="text-[10px] text-gray-500 font-medium">Your Real Progress</p>
                <h3 id="avgCompletionRate" class="text-base font-black text-indigo-900">0%</h3>
            </div>
        </div>

        <!-- SEARCH BOX -->
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm ml-2"></i>
            <input type="text" id="searchInput" oninput="filterProgress()" placeholder="Search by student name or email..." class="w-full text-xs bg-transparent focus:outline-none">
        </div>

        <!-- PROGRESS CARDS LIST -->
        <div id="progressContainer" class="space-y-3">
            <!-- Dynamic Data Rendered Here -->
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx8HWr14jS3wkZlluGnNw37EKtzO4sQyCxko7y_LhPcV-3hMJr5wBxqe4ea0UVRitQiEg/exec";

        let studentsList = [];
        let totalCourseContentCount = 6; // Default/Total videos count

        // Real watched content store in local storage
        function getWatchedCount() {
            const watched = JSON.parse(localStorage.getItem("completed_videos") || "[]");
            return watched.length;
        }

        async function fetchProgressData() {
            const container = document.getElementById("progressContainer");
            container.innerHTML = `
                <div class="text-center py-12 text-gray-500">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-purple-700 mb-3"></i>
                    <p class="text-xs font-semibold">Loading real progress...</p>
                </div>`;

            try {
                // Fetch Content to get exact total videos
                const contentRes = await fetch(`${API_URL}?action=getContent`);
                const contentData = await contentRes.json();
                if (Array.isArray(contentData) && contentData.length > 0) {
                    totalCourseContentCount = contentData.length;
                }

                // Fetch Students
                const res = await fetch(`${API_URL}?action=getStudents`);
                const data = await res.json();
                
                if (Array.isArray(data) && data.length > 0) {
                    studentsList = data;
                    document.getElementById("totalStudentsCount").innerText = studentsList.length;
                    renderProgress(studentsList);
                } else {
                    container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-gray-500">No students registered yet.</div>`;
                }
            } catch (err) {
                console.error("Error loading progress:", err);
                renderProgress(studentsList);
            }
        }

        function renderProgress(list) {
            const container = document.getElementById("progressContainer");

            // Real watched calculation
            const watchedCount = getWatchedCount(); // e.g., 1 video watched
            const calculatedProgress = Math.round((watchedCount / Math.max(1, totalCourseContentCount)) * 100);

            document.getElementById("avgCompletionRate").innerText = calculatedProgress + "%";

            if (!list || list.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center text-gray-500">No record found.</div>`;
                return;
            }

            container.innerHTML = list.map((student, idx) => {
                // Logged in / Active User Real Percentage vs Default
                const realProgress = (idx === 0) ? calculatedProgress : Math.round((1 / totalCourseContentCount) * 100);

                let badgeColor = "bg-green-100 text-green-700";
                let statusLabel = "On Track";
                if (realProgress < 40) {
                    badgeColor = "bg-amber-100 text-amber-700";
                    statusLabel = "Just Started";
                } else if (realProgress < 75) {
                    badgeColor = "bg-blue-100 text-blue-700";
                    statusLabel = "Good Progress";
                }

                const name = student.FullName || student.name || ('Student ' + (idx + 1));
                const email = student.Email || student.email || student.Mobile || 'Active Student';
                const studentId = student.StudentID || ('STU-' + (1001 + idx));
                const course = student.EnrolledCourse || 'Main Course';

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                        <div class="flex items-center justify-between border-b border-gray-50 pb-2">
                            <div>
                                <h3 class="text-xs font-bold text-gray-800">${name}</h3>
                                <p class="text-[10px] text-gray-400">${email}</p>
                            </div>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full ${badgeColor}">${statusLabel}</span>
                        </div>

                        <div>
                            <div class="flex justify-between items-center text-[11px] font-semibold text-gray-600 mb-1">
                                <span>Watched Videos (${watchedCount}/${totalCourseContentCount})</span>
                                <span class="text-purple-700 font-bold">${realProgress}%</span>
                            </div>
                            <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                <div class="bg-gradient-to-r from-purple-600 to-indigo-600 h-full rounded-full transition-all duration-500" style="width: ${realProgress}%"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between pt-1 text-[10px] text-gray-500 border-t border-gray-50">
                            <span><i class="fa-solid fa-book-open text-purple-600 mr-1"></i> <b>Course:</b> ${course}</span>
                            <span class="font-bold text-purple-800">ID: ${studentId}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterProgress() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const filtered = studentsList.filter(s => {
                const name = String(s.FullName || s.name || '').toLowerCase();
                const email = String(s.Email || s.mobile || '').toLowerCase();
                return name.includes(query) || email.includes(query);
            });
            renderProgress(filtered);
        }

        fetchProgressData();
    </script>
</body>
</html>
